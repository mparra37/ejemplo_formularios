<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulario</title>
	<link rel="stylesheet" type="text/css" href="estilo_forms.css">

</head>
<body>

	<h1>Formularios</h1>
	<form>
		<label for="nombre">Nombre:</label>
		<input type="text" name="nombre" required>
		<br>
		<label for="apellid">Apellido:</label>
		<input type="text" name="apellido" required>
		<br>
		<label for="correo">Correo:</label>
		<input type="email" name="correo" required>
		<br>
		<label for="contra">Contraseña:</label>
		<input type="password" name="contra" required>
		<br>

		<label>Campus ITSON:</label>
		<select>
			<option value="0">Seleccionar:</option>
			<option>Ciudad Obregón</option>
			<option>Navojoa</option>
			<option>Guaymas</option>
		</select>	
		<br>
		<label>Género:</label>
		<label>Masculino</label>
		<input type="radio" name="genero" value="masculino">
		<label>Femenino</label>
		<input type="radio" name="genero" value="femenino">
		<label>Otro</label>
		<input type="radio" name="genero" value="otro">

		<br>
		<label>Checkbox</label>
		<input type="Checkbox" name="condiciones">
		<br>
		<label>Área de Texto</label>
		<textarea rows="5" cols="20" placeholder="Escribe la info..."></textarea>
		<br>
		<input type="submit" name="enviar">

	</form>

</body>
</html>
