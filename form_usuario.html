<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulario de Usuario</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<!--<link rel="stylesheet" type="text/css" href="estilo2.css">-->
</head>
<body>

	
	<div class="container">

		<h1>Datos de Usuario</h1>

		<form>

			<label class="form-label" for="nombre">Nombre Completo:</label>
			<input class="form-control" type="text" name="nombre" required>

			<label class="form-label" for>Correo Electrónico</label>
			<input class="form-control" type="email" name="correo" required>

			<label class="form-label" for="contra">Contraseña:</label>
			<input class="form-control" type="password" name="contra" required>

			<label class="form-label" for="dob">Fecha de Nacimiento:</label>
			<input class="form-control" type="date" name="dob">

			<label class="form-label" for="tel">Teléfono:</label>
			<input class="form-control" type="number" name="">

			<label>Género:</label>
			<!--
			<div class="form-check ">
				
				<input type="radio" name="genero" value="masculino"><label>Masculino</label>
				<br>
				<input type="radio" name="genero" value="femenenino"><label>Femenino</label>
				<br>
				<input type="radio" name="genero" value="otro"><label>Otro</label>

			</div>-->

			<div class="form-check">
			  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
			  <label class="form-check-label" for="flexRadioDefault1">
			    Masculino
			  </label>
			</div>
			<div class="form-check">
			  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
			  <label class="form-check-label" for="flexRadioDefault2">
			    Femenino
			  </label>
			</div>
			<div class="form-check">
			  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
			  <label class="form-check-label" for="flexRadioDefault1">
			    Otro
			  </label>
			</div>
			
			<label class="form-label">Estado:</label>
			<select class="form-select">
				<option value="">seleccionar:</option>
				<option value="sonora">Sonora</option>
				<option value="sonora">Sinaloa</option>
				<option value="sonora">Baja California</option>
			</select>

			<label class="form-label">Imagen de Perfil:</label>
			<input class="form-control" type="file" name="perfil" accept="image/*">

			<label class="form-label">Biografía:</label>
			<textarea class="form-control">
				
			</textarea>

			<!--
			<input type="checkbox" name="aceptar">Acepto los términos y condiciones-->
			

			<div class="form-check">
				<input class="form-check-input" type="checkbox" value="" id="check">
				<label class="form-check-label" for="check">Acepto las condiciones</label>

			</div>

			<button class="btn btn-success mt-3" type="submit">REGISTRAR</button>

		</form>


	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	
</body>
</html>
